<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Exact type-I counterexample</title>
  <desc id="desc">Nominal alpha is 0.05, exact paper-test rejection is 0.1853, and the threshold mutation is 0.5147.</desc>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="80" y="65" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="700">Finite v1 type-I bound: exact boundary-null enumeration</text>
  <text x="80" y="102" fill="#475569" font-family="Arial, sans-serif" font-size="19">P(1)=0.1 · Q(1)=0.9 · m=8 · 65,536 ordered samples</text>
  <line x1="300" y1="475" x2="1100" y2="475" stroke="#94a3b8" stroke-width="2"/>
  <g fill="#475569" font-family="Arial, sans-serif" font-size="16">
    <text x="295" y="505">0.0</text><text x="445" y="505">0.1</text><text x="595" y="505">0.2</text>
    <text x="745" y="505">0.3</text><text x="895" y="505">0.4</text><text x="1045" y="505">0.5</text>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="80" y="202" fill="#0f172a" font-size="22">Nominal alpha</text>
    <rect x="300" y="165" width="75" height="52" rx="6" fill="#64748b"/>
    <text x="390" y="199" fill="#334155" font-size="19">0.050000</text>
    <text x="80" y="322" fill="#0f172a" font-size="22">Exact rejection</text>
    <rect x="300" y="285" width="278" height="52" rx="6" fill="#e11d48"/>
    <text x="593" y="319" fill="#9f1239" font-size="19" font-weight="700">0.185302</text>
    <text x="80" y="442" fill="#0f172a" font-size="22">Mutation control</text>
    <rect x="300" y="405" width="772" height="52" rx="6" fill="#f59e0b"/>
    <text x="1085" y="439" fill="#92400e" font-size="19" font-weight="700">0.514728</text>
  </g>
  <line x1="375" y1="135" x2="375" y2="475" stroke="#64748b" stroke-dasharray="8 7" stroke-width="2"/>
  <text x="80" y="555" fill="#9f1239" font-family="Arial, sans-serif" font-size="20" font-weight="700">Observed type-I error is 3.71× the nominal level.</text>
</svg>
