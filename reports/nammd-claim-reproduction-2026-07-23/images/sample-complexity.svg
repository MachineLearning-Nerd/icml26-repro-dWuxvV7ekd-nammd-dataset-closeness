<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Sample-complexity slope</title>
  <desc id="desc">The theorem line has log-log slope minus two, while the inverse-linear mutation has slope minus one.</desc>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="75" y="64" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="700">Claim 4: direct test of the displayed inverse-square bound</text>
  <text x="75" y="101" fill="#475569" font-family="Arial, sans-serif" font-size="19">log sufficient sample size versus log NAMMD margin</text>
  <line x1="150" y1="500" x2="1090" y2="500" stroke="#64748b" stroke-width="2"/>
  <line x1="150" y1="140" x2="150" y2="500" stroke="#64748b" stroke-width="2"/>
  <polyline points="190,165 360,230 530,295 700,360 870,425 1040,490" fill="none" stroke="#2563eb" stroke-width="6"/>
  <g fill="#2563eb">
    <circle cx="190" cy="165" r="8"/><circle cx="360" cy="230" r="8"/><circle cx="530" cy="295" r="8"/>
    <circle cx="700" cy="360" r="8"/><circle cx="870" cy="425" r="8"/><circle cx="1040" cy="490" r="8"/>
  </g>
  <polyline points="190,270 360,315 530,360 700,405 870,450 1040,495" fill="none" stroke="#f59e0b" stroke-width="5" stroke-dasharray="12 9"/>
  <g font-family="Arial, sans-serif">
    <text x="770" y="195" fill="#1d4ed8" font-size="23" font-weight="700">paper bound · slope −2.000000</text>
    <text x="770" y="233" fill="#92400e" font-size="21" font-weight="700">mutation · slope −1.000000</text>
    <text x="510" y="570" fill="#334155" font-size="21">log(margin)</text>
    <text x="40" y="340" fill="#334155" font-size="21" transform="rotate(-90 40 340)">log(sample bound)</text>
  </g>
  <text x="75" y="605" fill="#475569" font-family="Arial, sans-serif" font-size="17">Independent 73-point regression: R² = 1.0; m·margin² invariant to 1.42e−14.</text>
</svg>
