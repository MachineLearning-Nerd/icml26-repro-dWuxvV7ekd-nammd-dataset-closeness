[project]
name = "nammd-dataset-closeness-reproduction"
version = "0.1.0"
description = "Claim-by-claim CPU reproduction of arXiv:2507.12843"
requires-python = "==3.9.*"
dependencies = [
  "marimo>=0.10,<1",
  "matplotlib==3.9.1",
  "numpy==1.23.0",
  "pillow==10.4.0",
  "psutil==5.9.8",
  "pyyaml==6.0.1",
  "requests==2.32.3",
  "scikit-learn==1.5.1",
  "scipy==1.9.1",
  "torch==2.8.0",
  "torchvision==0.23.0",
]

[tool.uv]
required-version = "==0.11.29"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
